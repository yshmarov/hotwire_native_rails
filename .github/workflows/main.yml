name: Smoke test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    name: ${{ matrix.flavor }}
    strategy:
      fail-fast: false
      matrix:
        flavor:
          - tailwind4
          - tailwind3
          - css

    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Install Rails
        run: gem install rails --no-document
      - name: Generate an app, run the generator and its tests
        run: bin/smoke ${{ matrix.flavor }}
